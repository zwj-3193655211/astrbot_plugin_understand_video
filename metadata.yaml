name: astrbot_plugin_understand_video
display_name: 视频理解助手
short_desc: B站/抖音/通用平台/本地音视频 → 一键转文字 + AI 总结
desc: |
  把 B 站、抖音、YouTube/AcFun/微博（通过 yt-dlp）、本地音视频（mp4 / mkv / mp3 / wav / m4a 等）转成带时间戳的文字，再用 LLM 做内容总结。

  **v2.1.0 重要更新**
  - ✨ **自然语言链接触发**：消息里含 B 站 / 抖音 / YouTube 等链接**自动识别**，不用加 `/video` 前缀
    - 例：「https://b23.tv/xxx 这个视频讲了啥」→ 直接触发转写
    - 命中后 stop_event() 阻止 LLM 处理，由插件自己接管（避免 Qbot 自问自答）
  - ✅ B 站短链（b23.tv）展开支持

  **核心特性**
  - 🎙️ 多源输入：B 站（BV / bilibili.com / b23.tv 短链）/ 抖音（v.douyin.com / douyin.com）/ 通用平台（YouTube / AcFun / 微博，需 yt-dlp）/ 本地音视频
  - 🚀 双 ASR 后端：本地 FunASR Paraformer-Large（GPU 最佳，~1.1GB 模型）/ 云端 SiliconFlow / 火山方舟 / 任意 OpenAI 兼容端点（按用量计费，零模型下载）
  - 🤖 AI 总结：复用 AstrBot 现有 LLM provider，提示词可配置
  - 💾 缓存管理：音频和转写文本自动缓存，重复处理秒回
  - 🛠️ 数据规范：所有数据（缓存/模型/配置）放在 AstrBot 数据目录，升级不丢数据

  **使用**
  ```
  # 自然语言触发（v2.1.0+ 推荐）
  https://b23.tv/xxx 这个视频讲了啥
  帮我转写 https://www.bilibili.com/video/BV1xx

  # 命令触发（兼容旧版）
  /video BV1xx411c7mD
  /video https://v.douyin.com/xxx
  /video C:\Videos\lecture.mp4
  /video_init        # 初始化（按需装依赖 + 下模型）
  /video_status      # 环境 / 后端 / 缓存状态
  /video_clear       # 清空缓存
  /video_open        # 打开缓存目录
  /video_help        # 完整帮助
  ```

  底层基于 [video-transcriber skill](https://github.com/zwj-3193655211/video-transcriber)。
